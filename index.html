    <script>
      // Automatically route to compiled build if served as static root on GitHub Pages
      (function() {
        if (window.location.hostname.includes('github.io')) {
          var p = window.location.pathname;
          if (!p.includes('/dist') && !p.includes('/docs')) {
            var dest = p.replace(/\/$/, '') + '/dist/';
            window.location.replace(dest);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
